name: Build APK and IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Fix Kotlin version compatibility
        run: |
          # Fix Compose Compiler / Kotlin version mismatch
          # Compose Compiler 1.5.15 requires Kotlin 1.9.25
          cd android
          if grep -q "kotlinVersion" build.gradle; then
            sed -i "s/kotlinVersion = .*/kotlinVersion = '1.9.25'/" build.gradle
          else
            sed -i "/ext {/a\\        kotlinVersion = '1.9.25'" build.gradle
          fi
          echo "Kotlin version patched to 1.9.25"
          grep -i "kotlin" build.gradle | head -5

      - name: Install Android deps
        run: |
          cd android
          ./gradlew --version

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_ELEVENLABS_API_KEY: ${{ secrets.EXPO_PUBLIC_ELEVENLABS_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coze-app-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA (EAS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build IPA with EAS
        run: |
          # Initialize EAS project if not already configured
          eas init --non-interactive || true
          
          # Build with EAS
          eas build --platform ios --profile preview --non-interactive --no-wait 2>&1 | tee eas-build.log
          
          # Extract build URL if available
          grep -oP 'https://expo\.dev/accounts/[^\s]+' eas-build.log || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for EAS build and download
        run: |
          echo "Waiting for EAS iOS build to complete..."
          for i in $(seq 1 60); do
            sleep 30
            echo "Polling attempt $i..."
            
            BUILD_JSON=$(eas build:list --platform ios --limit 1 --json 2>/dev/null || echo "[]")
            
            STATUS=$(echo "$BUILD_JSON" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            if d and len(d)>0:
              s = d[0].get('status','unknown')
              print(s)
            else:
              print('no_build')
          except:
            print('parse_error')
          " 2>/dev/null || echo "error")
            
            echo "Status: $STATUS"
            
            if [ "$STATUS" = "FINISHED" ]; then
              ARTIFACT_URL=$(echo "$BUILD_JSON" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d[0].get('artifacts',{}).get('applicationArchiveUrl',''))
          " 2>/dev/null || echo "")
              
              echo "Downloading artifact from: $ARTIFACT_URL"
              if [ -n "$ARTIFACT_URL" ]; then
                curl -L -o coze-app.ipa "$ARTIFACT_URL"
                echo "Download complete!"
                ls -la *.ipa
              fi
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "error" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "EAS build failed with status: $STATUS"
              echo "Build details:"
              echo "$BUILD_JSON" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d and len(d)>0:
            b = d[0]
            print(f\"  Platform: {b.get('platform','?')}\")
            print(f\"  Status: {b.get('status','?')}\")
            print(f\"  Error: {b.get('error',{}).get('message','N/A') if isinstance(b.get('error'), dict) else b.get('error','N/A')}\")
            print(f\"  Created: {b.get('createdAt','?')}\")
            print(f\"  Artifacts: {json.dumps(b.get('artifacts',{}), indent=2)}\")
          " 2>/dev/null || echo "Could not parse build details"
              exit 1
            fi
          done
          
          echo "Polling timed out or completed."
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coze-app-ios-ipa
          path: "*.ipa"
          if-no-files-found: warn
          retention-days: 30
