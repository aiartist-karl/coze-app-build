name: Build APK and IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install Android deps
        run: |
          cd android
          ./gradlew --version

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_ELEVENLABS_API_KEY: ${{ secrets.EXPO_PUBLIC_ELEVENLABS_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coze-app-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA (EAS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build IPA with EAS
        run: eas build --platform ios --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for EAS build and download
        run: |
          echo "Waiting for EAS build to complete..."
          MAX_ATTEMPTS=60
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 30
            ATTEMPT=$((ATTEMPT + 1))
            echo "Check $ATTEMPT/$MAX_ATTEMPTS..."
            eas build:list --platform ios --status finished --limit 1 --non-interactive 2>/dev/null | tee /tmp/eas_status.txt
            if grep -qi "finished" /tmp/eas_status.txt; then
              echo "EAS build completed!"
              break
            fi
            if grep -qi "error" /tmp/eas_status.txt; then
              echo "EAS build failed with error!"
              eas build:list --platform ios --limit 3 --non-interactive
              exit 1
            fi
          done
          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo "Timeout waiting for EAS build"
            eas build:list --platform ios --limit 3 --non-interactive
            exit 1
          fi
          eas build:download --platform ios --non-interactive || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: coze-app-ios
          path: "*.ipa"
          retention-days: 30
