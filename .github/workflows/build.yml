name: Build APK and IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Initialize EAS project
        run: eas init --id $(cat app.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('extra',{}).get('eas',{}).get('projectId',''))" 2>/dev/null || echo "") --non-interactive 2>/dev/null || eas init --non-interactive 2>&1 || true

      - name: Build APK with EAS
        run: |
          # First try eas init to link the project
          eas init --non-interactive 2>&1 || true
          # Then build
          eas build --platform android --profile preview --non-interactive 2>&1 | tee eas-build.log

      - name: Wait for build and download artifact
        run: |
          # Extract build URL from EAS output
          BUILD_URL=$(grep -oP 'https://expo.dev/[^ ]+' eas-build.log | head -1 || echo "")
          echo "Build URL: $BUILD_URL"
          
          if [ -z "$BUILD_URL" ]; then
            # Poll for the latest build
            for i in $(seq 1 60); do
              sleep 30
              echo "Polling build status... attempt $i"
              BUILD_INFO=$(eas build:list --platform android --limit 1 --json 2>/dev/null || echo "[]")
              STATUS=$(echo "$BUILD_INFO" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            if d and len(d)>0:
              print(d[0].get('status','unknown'))
            else:
              print('no_build')
          except: print('error')
          " 2>/dev/null)
              echo "Build status: $STATUS"
              if [ "$STATUS" = "FINISHED" ]; then
                ARTIFACT_URL=$(echo "$BUILD_INFO" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d[0].get('artifacts',{}).get('applicationArchiveUrl',''))
          " 2>/dev/null)
                echo "Downloading from: $ARTIFACT_URL"
                curl -L -o coze-app.apk "$ARTIFACT_URL"
                break
              elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
                echo "Build failed with status: $STATUS"
                exit 1
              fi
            done
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coze-app-android-apk
          path: "*.apk"
          if-no-files-found: warn
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Initialize EAS project
        run: eas init --non-interactive 2>&1 || true

      - name: Build IPA with EAS
        run: eas build --platform ios --profile preview --non-interactive 2>&1 | tee eas-build.log

      - name: Wait for build and download artifact
        run: |
          for i in $(seq 1 60); do
            sleep 30
            echo "Polling iOS build status... attempt $i"
            BUILD_INFO=$(eas build:list --platform ios --limit 1 --json 2>/dev/null || echo "[]")
            STATUS=$(echo "$BUILD_INFO" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            if d and len(d)>0:
              print(d[0].get('status','unknown'))
            else:
              print('no_build')
          except: print('error')
          " 2>/dev/null)
            echo "Build status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              ARTIFACT_URL=$(echo "$BUILD_INFO" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d[0].get('artifacts',{}).get('applicationArchiveUrl',''))
          " 2>/dev/null)
              echo "Downloading from: $ARTIFACT_URL"
              curl -L -o coze-app.ipa "$ARTIFACT_URL"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
          done

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coze-app-ios-ipa
          path: "*.ipa"
          if-no-files-found: warn
          retention-days: 30
