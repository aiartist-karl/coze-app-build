name: Build APK and IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK with EAS
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build and download artifact
        run: |
          sleep 300
          eas build:download --platform android --non-interactive || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coze-app-android
          path: "*.apk"
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Prebuild Expo
        run: npx expo prebuild --platform ios

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Unsigned IPA
        run: |
          xcodebuild -workspace ios/cozeappv2.xcworkspace \
            -scheme cozeappv2 \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/cozeappv2.app Payload/
          zip -r coze-app-ios-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: coze-app-ios-unsigned
          path: coze-app-ios-unsigned.ipa
          retention-days: 30
