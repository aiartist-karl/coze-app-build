name: Build APK and IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Install missing deps after prebuild
        run: npm install expo-asset

      - name: Fix Kotlin version compatibility
        run: |
          # Upgrade Kotlin from 1.9.24 to 1.9.25 to match Compose Compiler 1.5.15
          sed -i 's/kotlinVersion = "1.9.24"/kotlinVersion = "1.9.25"/g' android/build.gradle || true
          sed -i 's/kotlin_version = "1.9.24"/kotlin_version = "1.9.25"/g' android/build.gradle || true
          sed -i 's/kotlin = "1.9.24"/kotlin = "1.9.25"/g' android/build.gradle || true
          # Also try gradle.properties
          grep -n "kotlin" android/build.gradle || true
          echo "After fix:"
          grep -i "kotlin" android/build.gradle | head -5

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coze-app-android
          path: "android/app/build/outputs/apk/release/*.apk"
          retention-days: 30
          if-no-files-found: warn

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Prebuild Expo (iOS)
        run: npx expo prebuild --platform ios

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Unsigned IPA
        run: |
          # Fix: use find to correctly detect .xcodeproj directory
          PROJECT_DIR=$(find ios -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          PROJECT_NAME=$(basename "$PROJECT_DIR" .xcodeproj)
          WORKSPACE="${PROJECT_NAME}.xcworkspace"
          
          echo "Project dir: $PROJECT_DIR"
          echo "Project name: $PROJECT_NAME"
          echo "Workspace: $WORKSPACE"
          
          # Verify workspace exists
          if [ ! -d "ios/$WORKSPACE" ]; then
            echo "ERROR: Workspace ios/$WORKSPACE does not exist!"
            ls -la ios/
            exit 1
          fi
          
          xcodebuild -workspace "ios/$WORKSPACE" \
            -scheme "$PROJECT_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build
          
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/${PROJECT_NAME}.app Payload/
          zip -r coze-app-ios-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coze-app-ios-unsigned
          path: coze-app-ios-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn
